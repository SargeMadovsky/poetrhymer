name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests (without proprietary dictionaries)
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --bin poetrhymer
      - name: Verify Windows icon and version resources
        run: python tools/verify_windows_icon.py target/release/poetrhymer.exe
